<svg xmlns="http://www.w3.org/2000/svg" role="img" width="880" height="300" viewBox="0 0 880 300" aria-labelledby="title desc">
  <title id="title">How NousOS works</title>
  <desc id="desc">Original sources lead to records that cite them; people search these records and explore them in a graph; exploratory suggestions, which are not evidence, go to a person, whose approval is recorded as a decision, not as source evidence.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .box { fill: #0d1117; stroke: #6e7681; stroke-width: 1.5; }
    .title { fill: #e6edf3; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .subtitle { fill: #9198a1; font-size: 13px; text-anchor: middle; }
    .arrow { fill: none; stroke: #9198a1; stroke-width: 1.6; marker-end: url(#arrowhead); }
    .exploratory { stroke-dasharray: 5 4; }
    .arrow-label { fill: #c9d1d9; font-size: 13px; text-anchor: start; }
    .legend { fill: #9198a1; font-size: 13px; text-anchor: start; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#9198a1" />
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="879" height="299" rx="12" />

  <!-- Box 1: Original sources. -->
  <rect class="box" x="25" y="35" width="250" height="80" rx="10" />
  <text class="title" x="150" y="68">Original sources</text>
  <text class="subtitle" x="150" y="91">kept as unchanged copies</text>

  <!-- Box 2: Accepted knowledge (cited records and approved decisions). -->
  <rect class="box" x="315" y="35" width="250" height="80" rx="10" />
  <text class="title" x="440" y="68">Accepted knowledge</text>
  <text class="subtitle" x="440" y="91">cited records · approved decisions</text>

  <!-- Box 3: Search and exploration. -->
  <rect class="box" x="605" y="35" width="250" height="80" rx="10" />
  <text class="title" x="730" y="68">Search and exploration</text>
  <text class="subtitle" x="730" y="91">text search · 2D and 3D graph</text>

  <!-- Box 4: Exploratory suggestions. -->
  <rect class="box" x="605" y="185" width="250" height="80" rx="10" />
  <text class="title" x="730" y="218">Exploratory suggestions</text>
  <text class="subtitle" x="730" y="241">possible links, not evidence</text>

  <!-- Box 5: A person reviews. -->
  <rect class="box" x="315" y="185" width="250" height="80" rx="10" />
  <text class="title" x="440" y="218">A person reviews</text>
  <text class="subtitle" x="440" y="241">approves or declines</text>

  <!-- Arrow 1 to 2: records cite the original sources. -->
  <path class="arrow" d="M 275 75 H 315" />
  <!-- Arrow 2 to 3: records are searchable and explorable. -->
  <path class="arrow" d="M 565 75 H 605" />
  <!-- Arrow 3 to 4: exploration can produce suggestions, not evidence. -->
  <path class="arrow exploratory" d="M 730 115 V 185" />
  <!-- Arrow 4 to 5: suggestions go to a person for review. -->
  <path class="arrow" d="M 605 225 H 565" />
  <!-- Arrow 5 to 2: an approval is recorded as a decision, not as source evidence. -->
  <path class="arrow" d="M 440 185 V 115" />
  <text class="arrow-label" x="452" y="154">approved</text>

  <text class="legend" x="25" y="205">Dashed arrow: a suggestion, not evidence.</text>
  <text class="legend" x="25" y="225">Approval is recorded as a person's</text>
  <text class="legend" x="25" y="245">decision, not as source evidence.</text>
</svg>

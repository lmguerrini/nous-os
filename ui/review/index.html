<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NousOS · revisione grafo</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101725;color:#edf3fc}*{box-sizing:border-box}body{margin:0}header{padding:.8rem 1rem;border-bottom:1px solid #526072;display:flex;align-items:center;flex-wrap:wrap;gap:.7rem}h1{font-size:1.15rem;margin:0 1rem 0 0}button,input,select{font:inherit;color:#edf3fc;background:#202e42;border:1px solid #72839a;border-radius:5px;padding:.4rem .6rem}button{cursor:pointer}button:hover,button:focus-visible{background:#354a66}button[aria-pressed=true]{background:#3a5879;border-color:#b4dcff}form{display:flex;gap:.4rem}label{display:flex;align-items:center;gap:.35rem}#status,#notice,#counter{color:#c7d8eb}#notice{flex-basis:100%;font-size:.86rem}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(21rem,25rem);height:calc(100vh - 15rem);min-height:30rem}#viewport{position:relative;min-width:0;overflow:hidden}aside{padding:1rem;overflow:auto;border-left:1px solid #526072}aside h2{overflow-wrap:anywhere;font-size:1.1rem;margin-top:0}aside h3{font-size:1rem}dl{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:.5rem}dt{color:#a9c2db}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}blockquote{margin:1rem 0;padding:.8rem;background:#1d2b3d;border-left:3px solid #94c7f2;white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:#7b402a;color:#fff2db;border:1px solid #ffbd84;padding:.25rem .5rem;border-radius:4px}.relation{display:block;text-align:left;width:100%;margin:.3rem 0}.space-label{color:#edf3fc;text-shadow:0 1px 4px #000;font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}footer{padding:.6rem 1rem;border-top:1px solid #526072}.legend{display:flex;gap:.5rem 1rem;flex-wrap:wrap;font-size:.85rem}#error{position:absolute;top:1rem;left:1rem;z-index:2;background:#5e2c31;padding:1rem}[hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}aside{border-left:0;border-top:1px solid #526072}}
</style></head><body>
<header><h1>NousOS · revisione</h1><button id="view-2d" aria-pressed="true">2D</button><button id="view-3d" aria-pressed="false">3D</button>
<label>Dominio <select id="filter-domain"><option value="">Tutti</option></select></label><label>Classe <select id="filter-class"><option value="">Tutte</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
<label>Standing <select id="filter-standing"><option value="">Tutti</option><option value="canonical">Canonico</option><option value="proposal">Proposta</option><option value="source">Fonte</option></select></label>
<label>Tipo <select id="filter-type"><option value="">Tutti</option><option>domain</option><option>connection</option><option>evidence</option><option>record</option><option>conversation</option><option>candidate</option><option>canon</option></select></label>
<form id="search-form" role="search"><input id="search" type="search" placeholder="Etichetta o ID" aria-label="Cerca etichetta o ID"><button>Cerca</button></form><span id="search-feedback"></span><span id="counter"></span><span id="status">Caricamento…</span><span id="notice"></span></header>
<main><div id="viewport" aria-label="Grafo di revisione"><div id="error" role="alert" hidden></div></div><aside id="details" aria-live="polite">Seleziona un nodo o una relazione.</aside></main>
<footer><div id="legend" class="legend"></div><p>La posizione nello spazio non è una relazione.</p></footer><script type="module" src="./review.js"></script></body></html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NousOS · grafo di revisione</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.45 system-ui,sans-serif; background:#050505; color:#e8e8e8 }
    * { box-sizing:border-box } body { margin:0; height:100dvh; display:flex; flex-direction:column; overflow:hidden }
    button,input,select { font:inherit; color:inherit; background:#111; border:1px solid #383838; border-radius:4px; padding:4px 7px }
    button { cursor:pointer } button:hover,button:focus-visible,input:focus-visible,select:focus-visible { border-color:#aaa; outline:0 }
    button[aria-pressed=true] { border-color:#eee; background:#303030 } button:disabled { opacity:.45; cursor:not-allowed }
    [hidden] { display:none!important } header { padding:6px 10px; border-bottom:1px solid #333; flex:none; max-height:34dvh; overflow:auto }
    .header-top,.axes,.tools,.axis { display:flex; gap:5px; align-items:center; flex-wrap:wrap; min-width:0 }
    .header-top h1 { font-size:15px; margin:0 12px 0 0; white-space:nowrap } #status,#counter,#notice { font-size:11px; color:#aaa }
    #notice { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw }
    .axes,.tools { margin-top:5px } .axis { padding:3px 8px 3px 0; border-right:1px solid #333 }
    .axis strong { color:#aaa; font-size:10px; letter-spacing:.05em; text-transform:uppercase; margin-right:3px }
    #search-form,#fullscreen-search-form { display:flex; gap:4px } #search,#fullscreen-search { width:clamp(140px,16vw,260px) }
    .tools label { display:flex; align-items:center; gap:4px } .tools select { max-width:112px } .tools #palette { max-width:160px }
    main { position:relative; flex:1; min-height:0; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,340px) }
    main.panel-collapsed { grid-template-columns:minmax(0,1fr) } main.panel-collapsed #details { display:none }
    #viewport { position:relative; overflow:hidden; min-width:0; background:#050505 }
    #render-root { position:absolute; inset:0 }
    #details { min-width:0; overflow:auto; border-left:1px solid #333; background:#090909; padding:12px; overflow-wrap:anywhere }
    #details h2 { font-size:17px; overflow-wrap:anywhere } #details p,#details dd,#details blockquote { overflow-wrap:anywhere; white-space:pre-wrap }
    #details dt,#details small,.muted,.subtitle { color:#aaa } #details dd { margin:0 } #details dl { margin:8px 0 }
    .detail-row { padding:5px 0; border-bottom:1px solid #242424 } .technical { font-family:ui-monospace,monospace;font-size:11px }
    blockquote { border-left:2px solid #aaa; margin:8px 0; padding:8px; background:#141414 }
    .relation { display:block; width:100%; text-align:left; margin:4px 0 } .minor { font-size:11px }
    .breadcrumbs { display:flex;gap:4px;flex-wrap:wrap } .panel-advanced,#legend-section { border-top:1px solid #333; margin-top:14px;padding-top:8px }
    #live-section { border:1px solid #333;padding:8px;margin-bottom:10px } #live-query { min-width:0;width:100% }
    #live-search-form { display:flex } .live-result { border-top:1px solid #333;padding:6px 0 }
    #appearance-panel { position:absolute;z-index:24;top:9px;right:9px;width:min(270px,calc(100% - 18px)); max-height:min(76vh,550px);overflow:auto;background:#121212ee;border:1px solid #555;border-radius:6px;padding:10px;box-shadow:0 10px 25px #000 }
    #appearance-panel h2 {font-size:14px;margin:0 0 6px} #appearance-panel label { display:grid;grid-template-columns:1fr auto;gap:4px;margin:6px 0 }
    #appearance-panel input[type=range] { grid-column:1/3; width:100%; padding:0 } #appearance-panel input[type=color] { width:42px;height:26px;padding:1px }
    #appearance-panel .preset-row { display:flex;gap:4px;flex-wrap:wrap;margin-top:6px } #appearance-panel input[type=text] { min-width:0;width:100% }
    #appearance-panel select { max-width:100% } #contrast-warning { color:#ffb3a1 }
    #focus-chip,#toast { position:absolute;z-index:22;left:50%;transform:translateX(-50%);background:#171717dd;border:1px solid #777;padding:5px 9px;border-radius:4px;white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis }
    #focus-chip { bottom:9px } #toast { top:10px } #gizmo { position:absolute;z-index:23;bottom:12px;left:12px;width:92px;height:92px;pointer-events:none;background:#111b;border:1px solid #666;border-radius:50% }
    #gizmo button { position:absolute;pointer-events:auto;border-radius:50%;padding:0;width:21px;height:21px;font-size:10px;font-weight:bold }
    #gizmo svg { width:100%;height:100%;position:absolute;inset:0 } #gizmo line { stroke-width:2 } #axis-x { stroke-width:1.5 } #axis-y { stroke-width:3.5 } #axis-z { stroke-width:2 }
    #fullscreen-bar { display:none;position:absolute;z-index:26;top:8px;left:8px;right:8px;gap:4px;align-items:center;flex-wrap:wrap;background:#111d;border:1px solid #555;border-radius:6px;padding:5px;max-height:25vh;overflow:auto }
    #viewport:fullscreen { width:100vw;height:100vh } #viewport:fullscreen #fullscreen-bar { display:flex }
    .flow-legend { display:flex;flex-direction:column;gap:3px }
    .flow-legend-entry { display:flex;align-items:center;gap:6px;margin:0;font-size:11px;color:#ccc }
    .flow-legend-entry svg { flex:none }
    #flow-legend-section { border-top:1px solid #333; margin-top:14px; padding-top:8px }
    /* D-071 G11: the selection details start with their own rule and heading, so the first detail
       line never reads as a truncated legend entry. */
    #selection-heading { border-top:1px solid #333; margin-top:14px; padding-top:8px }
    #fullscreen-legend { display:none;position:absolute;z-index:24;right:12px;bottom:12px;background:#111d;border:1px solid #555;border-radius:6px;padding:6px 9px }
    #viewport:fullscreen #fullscreen-legend { display:block }
    #viewport:fullscreen #details:not(.drawer) { display:none } #details.drawer { display:block;position:absolute;z-index:25;right:0;top:0;bottom:0;width:min(360px,90vw);box-shadow:-10px 0 30px #000 }
    #v2-edge-tooltip { position:fixed;z-index:40;max-width:220px;padding:5px 8px;background:#171717;border:1px solid #aaa;border-radius:4px;pointer-events:none }
    .v2-pulse { position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px #fff;animation:v2-pulse 900ms ease-out forwards }
    @keyframes v2-pulse { from { transform:scale(.5);opacity:1 } to { transform:scale(3);opacity:0 } }
    @media(prefers-reduced-motion:reduce) { .v2-pulse { animation:none;opacity:.8 } }
    #v2-cap { color:#ffd5ab;font-weight:600 } #v2-controls button { margin-right:5px } #details { max-width:100%; } #details button { max-width:100%; overflow-wrap:anywhere }
    #error { padding:6px;background:#522 } .popover { position:fixed;z-index:30;right:8px;top:95px;width:min(270px,calc(100vw - 16px));background:#111;border:1px solid #555;padding:10px;max-height:50vh;overflow:auto }
    @media(max-width:1100px) { header { max-height:37dvh } main { grid-template-columns:minmax(0,1fr) } #details {display:none;position:absolute;z-index:25;right:0;top:0;bottom:0;width:min(360px,90vw);box-shadow:-10px 0 30px #000} #details.drawer {display:block} }
    header { overflow:visible;max-height:none } .axes,.tools { flex-wrap:wrap;overflow:visible;row-gap:4px } .axis { flex-wrap:nowrap;white-space:nowrap;flex:none }
    .header-top { min-height:22px } .axes { gap:2px } .axis strong {font-size:9px} .axis button,.axis select,.tools button,.tools select { padding:3px 5px }
    .tools { position:relative } #search { width:clamp(130px,18vw,220px) }
    details.axis { position:relative;border:0;padding:0 } details.axis summary,#view-preset-menu summary {list-style:none;cursor:pointer;border:1px solid #444;border-radius:4px;background:#151515;padding:3px 7px}
    details.axis summary::-webkit-details-marker,#view-preset-menu summary::-webkit-details-marker {display:none}
    .menu-content {position:absolute;z-index:35;top:calc(100% + 5px);left:0;display:flex;flex-direction:column;align-items:stretch;gap:5px;min-width:155px;padding:8px;background:#161616;border:1px solid #666;border-radius:5px;box-shadow:0 8px 20px #000}
    #view-preset-menu {position:relative} #filter-menu .menu-content {min-width:235px} #more-menu .menu-content {right:0;left:auto}
    #appearance-panel {width:min(360px,calc(100% - 24px));max-height:calc(100% - 24px);top:12px;right:12px}
    #custom-editor {border-top:1px solid #555;margin-top:12px;padding-top:9px} #custom-editor h3 {font-size:14px;margin:0} #custom-editor p {font-size:11px;color:#bbb;margin:4px 0}
    .colour-row {display:grid;grid-template-columns:minmax(100px,1fr) 25px 42px 84px;align-items:center;gap:5px;margin:6px 0}
    .colour-row input[type=text] {width:84px;font-family:ui-monospace,monospace;padding:3px} .colour-row input[type=color] {width:42px}
    .colour-swatch {width:24px;height:24px;padding:0;border:1px solid #aaa} .hex-error {grid-column:1/-1;color:#ffb3a1} .hex-error:empty {display:none}
    .custom-actions {display:flex;flex-wrap:wrap;gap:5px}.custom-actions input {width:130px} .custom-actions select {max-width:170px}
    #panel-edge-toggle {position:absolute;z-index:26;top:50%;right:0;transform:translateY(-50%);padding:14px 7px;min-width:38px;text-align:center;border-radius:6px;background:#16161cf0;font-size:12px;line-height:1;color:#fff}
    #viewport:fullscreen #panel-edge-toggle {display:none}
    #panel-edge-toggle:hover,#panel-edge-toggle:focus-visible {border-color:#aaa;color:#fff;background:#222e}
    #harmony-controls {border-top:1px solid #444;margin-top:10px;padding-top:8px} #harmony-controls h4 {margin:0 0 6px;font-size:13px}
    .harmony-row {display:flex;flex-wrap:wrap;gap:6px;align-items:center} .harmony-row label {display:flex;align-items:center;gap:4px;margin:0}
    .harmony-row input[type=color] {width:42px;height:26px;padding:1px} .harmony-row select {max-width:150px}
    .harmony-swatches {display:flex;flex-wrap:wrap;gap:5px;margin-top:7px} .harmony-swatches .h-swatch {display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}
    .harmony-swatches .h-swatch i {width:30px;height:30px;border-radius:4px;border:1px solid #aaa} .harmony-swatches .h-swatch span {font-size:9px;color:#bbb;text-align:center;line-height:1.1}
    #gizmo {width:112px;height:112px;left:16px;bottom:16px;overflow:hidden} #gizmo button {width:24px;height:24px;font-size:12px;border:2px solid #fff;background:#191919;color:#fff;z-index:1}
    #gizmo button[data-axis-end=x] {border-style:solid;border-width:2px} #gizmo button[data-axis-end=y] {border-style:solid;border-width:3px} #gizmo button[data-axis-end=z] {border-style:double;border-width:4px}
    #fullscreen-bar.collapsed > :not(#fullscreen-collapse):not(#immersive-toggle):not(#fullscreen-exit) {display:none}
    #fullscreen-bar.immersive > :not(#immersive-toggle):not(#fullscreen-exit):not(#fullscreen-focus):not(#fullscreen-search-form):not(#fullscreen-appearance):not(.immersive-axis) {display:none}
    #viewport:fullscreen #gizmo {bottom:16px;left:16px} #viewport:fullscreen #appearance-panel {top:58px}
    @media(max-width:1350px) {.axes,.tools {gap:1px}.axis {padding-right:3px}.axis strong {display:none} #edit-colours {font-size:11px} #status,#counter,#notice {font-size:10px} }
    @media(max-width:1080px) {#edit-colours {max-width:80px;white-space:normal;line-height:1} #palette {max-width:120px} .axes button,.axes select {font-size:11px;padding:3px} .tools {min-height:28px} }
    #fullscreen-bar .immersive-axis {display:none} #fullscreen-bar.immersive .immersive-axis {display:flex}
    #control-tooltip {position:fixed;z-index:50;max-width:220px;padding:5px 8px;background:#242424;border:1px solid #777;border-radius:4px;box-shadow:0 5px 12px #000;pointer-events:none;font-size:11px}
    @media(max-width:1350px) {header {display:flex;flex-wrap:wrap;align-content:start;gap:4px 6px}.header-top {flex-basis:100%}.axes,.tools {display:contents}}
    #details .selection-card { max-width:62ch; line-height:1.45; overflow-wrap:break-word }
    #details .selection-card h2 { margin:8px 0 10px; font-size:19px; line-height:1.25 }
    #details .selection-section { border-top:1px solid #333; padding:11px 0 10px }
    #details .selection-section h3 { margin:0 0 5px; font-size:13px }
    #details .selection-section p { margin:4px 0; white-space:normal }
    #details .selection-badges { display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px }
    #details .selection-badge { border:1px solid #666;border-radius:12px;padding:2px 7px;font-size:11px;color:#ddd }
    #details .evidence-source,#details blockquote footer { color:#bcbcbc;font-size:12px }
    #details blockquote { margin:9px 0;padding:8px 10px;border-left:2px solid #aaa;background:#171717 }
    #details blockquote p { margin:0 0 5px }
    #details .relation-group { border-top:1px solid #292929;padding:8px 0 }
    #details .relation-group h4 { margin:0 0 6px;font-size:12px;color:#ccc }
    #details .selection-technical { border-top:1px solid #333;padding:12px 0 }
    #details .selection-technical summary { cursor:pointer;color:#ccc }
    #details .selection-technical pre { overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#bbb }
    .surface-close { position:sticky;top:0;float:right;z-index:2;display:grid;place-items:center;width:30px;height:30px;margin:0 0 6px 8px;padding:0;border:1px solid #777;border-radius:5px;background:#252525;color:#fff;font-size:22px;line-height:1;cursor:pointer }
    .menu-content .surface-close { align-self:flex-end;float:none }
    button.surface-active,summary.surface-active { background:#343434!important;border-color:#ddd!important;color:#fff!important }
    [hidden] { display:none!important }
  </style>
</head>
<body>
<header>
  <div class="header-top"><h1>NousOS · grafo di revisione</h1><span id="status" role="status">Caricamento…</span><span id="counter"></span><span id="v2-cap" role="status"></span><span id="notice"></span></div>
  <div class="axes">
    <div class="axis" data-axis="projection"><strong>Vista</strong><button data-value="2d" aria-pressed="true" title="Vista piana; trascina per spostare">2D</button><button data-value="3d" title="Vista prospettica; trascina per ruotare">3D</button><button id="projection-focus" disabled title="Seleziona prima un nodo">Focus</button><button id="fit" title="Adatta tutti gli elementi visibili">Adatta</button><button id="reset" title="Reimposta camera, focus e aspetto">Reimposta</button><button id="fullscreen" title="Apri il canvas a schermo intero">Fullscreen</button></div>
    <div class="axis" id="view-presets"><strong>Viste 3D</strong><details id="view-preset-menu"><summary>Orientamento</summary><div class="menu-content"><button data-preset="fronte" title="Vista frontale">Fronte</button><button data-preset="retro" title="Vista posteriore">Retro</button><button data-preset="sinistra" title="Vista da sinistra">Sinistra</button><button data-preset="destra" title="Vista da destra">Destra</button><button data-preset="alto" title="Vista dall'alto">Alto</button><button data-preset="basso" title="Vista dal basso">Basso</button><button data-preset="reset" title="Reimposta la direzione della camera">Reimposta vista</button></div></details></div>
    <div class="axis" data-axis="morphology"><strong>Morfologia</strong><button data-value="stellar" aria-pressed="true" title="Relazioni diritte">Stellar</button><button data-value="neural" title="Morfologia Neural">Neural</button><button data-value="mycelium" title="Morfologia Mycelium">Mycelium</button></div>
    <div class="axis" data-axis="organization"><strong>Organizzazione</strong><button data-value="flat" aria-pressed="true" title="Disposizione Flat">Flat</button><button data-value="indra" title="Finestre delle conversazioni">Indra</button></div>
    <div class="axis" data-axis="reading"><strong>Lettura</strong><button data-value="attested" aria-pressed="true" title="Solo relazioni attestate">Attestata</button><button data-value="exploratory" title="Connessioni interpretative non canoniche">Esplorativa</button><button data-value="combined" title="Relazioni attestate e connessioni esplorative">Combinata</button><label id="v2-relation-control" hidden>Relazioni <select id="v2-relation-detail" aria-label="Dettaglio delle relazioni"><option value="essential">essenziali</option><option value="all">tutte</option></select></label></div>
    <div class="axis" id="density-control" hidden><strong>Densità</strong><button data-density="essential" aria-pressed="false" title="Meno elementi a ogni livello di zoom: circa 150 nodi, 150 archi e 20 etichette">Essenziale</button><button data-density="balanced" aria-pressed="true" title="L'equilibrio fra leggibilità e dettaglio: circa 400 nodi, 450 archi e 40 etichette">Bilanciata</button><button data-density="complete" aria-pressed="false" title="Più dettaglio, non tutto insieme: fino a 850 nodi, circa 1.200 archi e 60 etichette">Completa</button></div>
  </div>
  <div class="tools"><form id="search-form" role="search"><input id="search" type="search" placeholder="Cerca etichetta o ID" aria-label="Cerca etichetta o ID" title="Cerca nel grafo"><button title="Cerca un nodo">Cerca</button></form><span id="search-feedback"></span><button id="panel-toggle" title="Mostra o nascondi il pannello; scorciatoia P">Pannello</button><details id="filter-menu" class="axis"><summary>Filtri</summary><div class="menu-content"><label>Dominio <select id="filter-domain" title="Filtra per dominio"><option value="">Tutti</option></select></label><label>Famiglia <select id="filter-family" title="Filtra per famiglia"><option value="">Tutte</option><option value="aggregate">Aggregati</option><option value="concept">Concetti</option><option value="source">Fonti</option></select></label><label>Stato <select id="filter-standing" title="Filtra per stato"><option value="">Tutti</option><option value="canonical">Canonico</option><option value="proposal">Proposta</option><option value="review">Revisione</option><option value="source">Fonte</option><option value="structure">Struttura</option></select></label><button id="labels" aria-pressed="true" title="Mostra o nascondi le etichette">Etichette</button></div></details><details id="more-menu" class="axis"><summary>Altro</summary><div class="menu-content"><span id="v2-controls-top" hidden><label><input id="semantic-zoom" type="checkbox" checked> Zoom semantico</label><button id="v2-undo" title="Annulla espansione">Annulla</button><button id="v2-redo" title="Ripeti espansione">Ripeti</button></span><button id="back" disabled title="Torna alla selezione precedente">Indietro</button><button id="expand" disabled title="Espandi il vicinato">Espandi</button><button id="advanced-button" aria-controls="advanced-controls" aria-expanded="false" title="Filtri tecnici">Avanzate</button></div></details><div id="advanced-controls" class="popover" hidden><label>Classe evidenza <select id="filter-class" title="Classe A/B/C/D per diagnosi"><option value="">Tutte</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label><input id="debug" type="checkbox" title="Vista tecnica"> Provenienza/Debug</label></div><div class="axis"><strong>Aspetto</strong><button id="appearance-toggle" title="Apri o chiudi i controlli di aspetto">Regola</button><select id="palette" title="Preset colore" aria-label="Preset colore"><option value="bw">Monocromatico</option><option value="warm">Caldo</option><option value="earth">Terra</option><option value="gems">Gemme</option><option value="night">Notturno</option><option value="semantic">Semantico</option><option value="amber">Ambra</option><option value="old-gold">Oro antico</option><option value="ochre">Terra/ocra</option><option value="copper">Rame</option><option value="alchemical-red">Rosso alchemico</option><option value="warm-twilight">Crepuscolo caldo</option><option value="sepia">Seppia</option><option value="brace">Brace</option><option value="miele">Miele</option><option value="custom">Custom</option></select><button id="edit-colours" title="Apri l’editor dei colori personalizzati">Modifica colori</button></div></div>
